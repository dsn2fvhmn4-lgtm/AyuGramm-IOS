name: Attach branch IPA to release

# Copies the IPA of a finished build into an existing release, server side, so a large file
# never has to pass through a slow connection. Triggered by changing release-request.json.
on:
  push:
    branches: [worktree-ayu-big-update]
    paths:
      - .github/release-request.json

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the build artifact and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(jq -r .run .github/release-request.json)
          tag=$(jq -r .tag .github/release-request.json)
          name=$(jq -r .asset .github/release-request.json)
          gh run download "$run" -R "$GITHUB_REPOSITORY" -D artifact
          ipa=$(find artifact -name '*.ipa' | head -1)
          test -n "$ipa"
          cp "$ipa" "$name"
          sha256sum "$name"
          gh release upload "$tag" "$name" -R "$GITHUB_REPOSITORY" --clobber
