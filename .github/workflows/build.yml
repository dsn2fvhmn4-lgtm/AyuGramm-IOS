name: Native iOS port

# Mirrors codemagic.yaml: cheap source checks run before the large native dependency
# download, so most source errors fail within a few minutes. Pushes to main that touch
# the port start a build; documentation-only pushes do not.
on:
  push:
    branches: [main]
    paths:
      - patches/**
      - ci/**
      - upstream.json
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      configuration:
        description: Native build configuration (debug_arm64 compiles much faster; both are unsigned)
        type: choice
        default: debug_arm64
        options: [debug_arm64, release_arm64, debug_sim_arm64]
      native_build:
        description: Run the full native build after source checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ayu-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  AYU_SKIP_DSYM: "1"
  CONFIGURATION: ${{ inputs.configuration || 'debug_arm64' }}

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 240
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select pinned Xcode and report resources
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          sw_vers
          df -h
      - name: Verify macOS build dependencies
        run: bash ci/prepare_macos.sh
      - name: Validate Telegram login credentials
        run: |
          python3 - <<'PY'
          import os, re
          api_id = os.environ.get('TELEGRAM_API_ID', '').strip()
          api_hash = os.environ.get('TELEGRAM_API_HASH', '').strip()
          if not api_id.isdigit() or int(api_id) <= 0 or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              raise SystemExit('Set TELEGRAM_API_ID and TELEGRAM_API_HASH in the repository Actions secrets before building.')
          print('Telegram API credentials are configured; values are hidden.')
          PY
      - name: Fetch pinned Telegram source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          pin = json.load(open('upstream.json'))
          subprocess.run(['git', 'init', 'telegram'], check=True)
          subprocess.run(['git', '-C', 'telegram', 'remote', 'add', 'origin', pin['repository']], check=True)
          subprocess.run(['git', '-C', 'telegram', 'fetch', '--depth=1', 'origin', pin['commit']], check=True)
          subprocess.run(['git', '-C', 'telegram', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Apply port and run source checks
        run: |
          set -euo pipefail
          {
            python3 ci/prepare.py telegram
            git -C telegram diff --check
            python3 -m unittest discover -s ci/tests -p 'test_*.py'
            python3 ci/preflight.py telegram
            python3 ci/test_models.py telegram | tee "$RUNNER_TEMP/ayu-tests.log"
          } 2>&1 | tee "$RUNNER_TEMP/ayu-checks.log"
      - name: Fetch pinned native dependencies
        if: github.event_name == 'push' || inputs.native_build
        run: |
          set -euo pipefail
          # Shallow first (much less to download); fall back to full history if a host refuses SHA fetches.
          git -C telegram submodule update --init --recursive --jobs=8 --depth=1 \
            || git -C telegram submodule update --init --recursive --jobs=8
      - name: Restore Bazel disk cache
        if: github.event_name == 'push' || inputs.native_build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ayu-bazel-cache
          key: ayu-bazel-${{ env.CONFIGURATION }}-${{ hashFiles('upstream.json') }}-${{ github.sha }}
          restore-keys: |
            ayu-bazel-${{ env.CONFIGURATION }}-${{ hashFiles('upstream.json') }}-
      - name: Build native AyuGram port
        if: github.event_name == 'push' || inputs.native_build
        run: python3 -u ci/build.py telegram --phase port --configuration "$CONFIGURATION"
      - name: Show errors on the run page
        if: failure()
        run: python3 ci/annotate_failure.py "AyuGram build failed" "$RUNNER_TEMP/ayu-checks.log" telegram/artifacts/port/build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ayugram-ios-${{ env.CONFIGURATION }}-unsigned-${{ github.run_number }}
          path: |
            telegram/artifacts/port/*.ipa
            telegram/artifacts/port/manifest.json
            telegram/artifacts/port/build.log
            ${{ runner.temp }}/ayu-tests.log
          if-no-files-found: ignore
          retention-days: 7
